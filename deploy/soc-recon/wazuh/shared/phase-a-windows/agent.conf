<!--
  Shared group config pushed from the manager to every agent in `phase-a-windows`.

  Kept in git deliberately: /var/ossec/etc/shared/ lives inside the wazuh_etc Docker
  volume, so a `docker compose down -v` erases it. Same failure class as the ISM
  retention policy lost in the Phase 0.5 rebuild (see wazuh/ism/README.md).

  Agents pull this automatically within ~5 min of a change, or immediately on restart.
  Windows default channels (Security, System, Application) are already collected by the
  agent's own ossec.conf — this adds the Sysmon channel on top.
-->
<agent_config>

  <!-- Sysmon (Olaf Hartong sysmon-modular). This is the Phase A.1 deliverable:
       proves the Sysmon -> eventchannel -> agent -> manager -> indexer chain, and
       is the telemetry Phase B's Sigma rules are written against. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
