<!-- Shared group config for `phase-a-windows`. See ../README.md before editing.
     NOTE: everything in this file, comments included, is merged into merged.mg and
     pushed to every agent in the group. Keep it lean. -->
<agent_config>

  <!-- Sysmon (Olaf Hartong sysmon-modular). Windows default channels (Security,
       System, Application) are already collected by the agent's own ossec.conf. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
