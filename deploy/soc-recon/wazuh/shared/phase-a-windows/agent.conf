<!-- Shared group config for `phase-a-windows`. See ../README.md before editing.
     NOTE: everything in this file, comments included, is merged into merged.mg and
     pushed to every agent in the group. Keep it lean. -->
<agent_config>

  <!-- Sysmon (Olaf Hartong sysmon-modular). Windows default channels (Security,
       System, Application) are already collected by the agent's own ossec.conf. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Volume Shadow Copy rewrites its diagnostic values on every shadow copy operation:
       about 600 of the 660 registry alerts (rule 750) in one week. Both registry views.
       The pattern ends in a backslash so it covers the keys under Diag and not a sibling
       whose name only starts with Diag. -->
  <syscheck>
    <registry_ignore arch="both" type="sregex">\System\CurrentControlSet\Services\VSS\Diag\</registry_ignore>
  </syscheck>

</agent_config>
