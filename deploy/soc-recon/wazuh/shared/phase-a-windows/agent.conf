<!-- Shared group config for `phase-a-windows`. See ../README.md before editing.
     NOTE: everything in this file, comments included, is merged into merged.mg and
     pushed to every agent in the group. Keep it lean. -->
<agent_config>

  <!-- Sysmon (Olaf Hartong sysmon-modular). Windows default channels (Security,
       System, Application) are already collected by the agent's own ossec.conf. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Microsoft Defender Antivirus. Stock rules 62100 to 62212 read this channel: a
       detection (event 1116) alerts as 62123 at level 12. About 36 alerts a day on the
       lab endpoint, nearly all the hourly health report (event 1150, level 3). -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Volume Shadow Copy rewrites its diagnostic values on every shadow copy operation:
       about 600 of the 660 registry alerts (rule 750) in one week. Both registry views.
       Two alternatives: the keys under Diag, and Diag itself. Neither covers a sibling
       whose name only starts with Diag.
       GOTCHA: the text must not end in a backslash. Wazuh's XML reader takes a backslash
       before the closing tag as an escape, the element never closes, and the agent
       rejects this whole file. -->
  <syscheck>
    <registry_ignore arch="both" type="sregex">\System\CurrentControlSet\Services\VSS\Diag\|\System\CurrentControlSet\Services\VSS\Diag$</registry_ignore>
  </syscheck>

</agent_config>
