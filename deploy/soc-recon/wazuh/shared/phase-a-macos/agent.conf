<!-- Shared group config for `phase-a-macos`. See ../README.md before editing.
     NOTE: everything in this file, comments included, is merged into merged.mg and
     pushed to every agent in the group. Keep it lean. -->
<agent_config>

  <!-- macOS unified logging. The agent's default ossec.conf collects /var/log/system.log,
       which on modern macOS carries almost nothing, because Apple moved everything to the
       unified log, readable only via `log`. Without this block the agent enrolls, reports
       Active, and collects essentially nothing.
       The predicate is deliberately narrow: auth, sudo, sessions. An unfiltered macos
       localfile is a firehose that will fill the indexer. -->
  <localfile>
    <location>macos</location>
    <log_format>macos</log_format>
    <query type="trace,log,activity" level="info">
      (process == "sudo") or (process == "sshd") or (process == "authd")
      or (subsystem == "com.apple.securityd")
    </query>
  </localfile>

</agent_config>
