<!-- Shared group config for `phase-a-linux`. See ../README.md before editing.
     NOTE: everything in this file, comments included, is merged into merged.mg and
     pushed to every agent in the group. Keep it lean. -->
<agent_config>

  <!-- auditd. The agent's default ossec.conf collects syslog and auth.log but not
       the audit log. Rules live in ../../audit/ and are applied on the endpoint. -->
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
  </localfile>

</agent_config>
