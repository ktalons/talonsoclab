<!-- Shared group config for `phase-a-linux`. See ../README.md before editing.
     NOTE: everything in this file, comments included, is merged into merged.mg and
     pushed to every agent in the group. Keep it lean. -->
<agent_config>

  <!-- auditd. The agent's default ossec.conf collects syslog and auth.log but not
       the audit log. Rules live in ../../audit/ and are applied on the endpoint. -->
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
  </localfile>

  <!-- Suricata IDS. The suricata container writes eve.json to this HOST path
       (see deploy/soc-recon/docker-compose.yml); this localfile is the seam.
       Only event_type "alert" reaches the indexer: ruleset rule 86601 is
       level 3, while 86602/86603/86604 (http/dns/tls) are level 0 and the
       manager drops them at log_alert_level 3. Flow/dns/tls stay full-fidelity
       in eve.json ON DISK — that file, not the SIEM, is the network archive
       until Phase B decides between logall_json and custom scoring rules.
       Only the SOC host has this file; any future member of this group without
       Suricata just logs a "file not found" once and carries on. -->
  <localfile>
    <location>/var/log/suricata/eve.json</location>
    <log_format>json</log_format>
  </localfile>

</agent_config>
