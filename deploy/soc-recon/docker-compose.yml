# SOC + recon stack — single Docker host. Tuned for the HP EliteDesk 800 G4 Mini
# (i5-8500T, 16 GB RAM, 256 GB NVMe). Always-on hard ceiling ≈ 8 GB
# (indexer 4 + manager 1.5 + dashboard 1 + suricata 1.5) + ~1.5 GB OS, leaving
# headroom for the 2 GB ephemeral recon burst. Comfortable on 16 GB.
#
# Wazuh    = always-on. Memory *reservation* + OOM protection.
# Suricata = always-on sensor. Protected, but killed BEFORE Wazuh under pressure.
# Recon    = ephemeral, cron-launched. Hard memory *cap* + OOM-preferred. Yields to Wazuh.
#
# DISK is the other constraint: 256 GB NVMe fills via the indexer volume. Set a
# Wazuh ISM retention policy (e.g. delete wazuh-alerts-* older than 45 days) and watch
# `df -h` — see README "Resource budget". Host prereq: vm.max_map_count=262144.
#
# This is the FULL working single-node deploy: the official wazuh-docker single-node
# topology (cert-based TLS + indexer security config) with this lab's 16 GB resource
# model + the ephemeral recon service folded in. To bring it up:
#   1. docker compose -f generate-indexer-certs.yml run --rm generator   (once)
#   2. docker compose up -d
# See README "Run". Default credentials are the well-known Wazuh defaults sourced from
# .env — CHANGE THEM (and regenerate internal_users.yml hashes) before any exposure.

name: soc-recon

services:
  # ─────────────────────── Wazuh SOC stack (always-on) ───────────────────────
  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      # heap == reservation floor, keep Xms == Xmx. Tuned for a 16 GB host
      # (INDEXER_HEAP=2g in .env). Raise only after a RAM upgrade.
      - "OPENSEARCH_JAVA_OPTS=-Xms${INDEXER_HEAP:-2g} -Xmx${INDEXER_HEAP:-2g}"
    ulimits:
      memlock: { soft: -1, hard: -1 }          # OpenSearch needs to lock memory
      nofile:  { soft: 65536, hard: 65536 }
    mem_reservation: 2g     # soft floor the kernel honors under contention (== heap)
    mem_limit: 4g           # ceiling so a runaway query can't eat the host
    oom_score_adj: -700     # near-last thing the kernel kills
    healthcheck:
      # gate dependents on the indexer actually answering, not just "started"
      test: ["CMD-SHELL", "curl -sk -u admin:${WAZUH_INDEXER_PASS:-SecretPassword} https://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      # 4.14 moved the indexer config root to /usr/share/wazuh-indexer/config/.
      # These paths MUST stay in sync with the pemcert_filepath entries in
      # config/wazuh_indexer/wazuh.indexer.yml — mismatch = indexer won't boot.
      - indexer_data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks: [soc]

  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    mem_reservation: 1g
    mem_limit: 1500m        # modest with a handful of real-device agents
    oom_score_adj: -700
    ports:
      - "1514:1514"         # agent data
      - "1515:1515"         # agent enrollment
      - "514:514/udp"       # syslog
      - "55000:55000"       # Wazuh API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASS:-SecretPassword}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASS:-MyS3cr37P450r.*-}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # "Sigma + Atomic" is NOT a third container:
      #   • Sigma  -> convert with sigma-cli to Wazuh rule XML, mount here.
      #   • Atomic -> a test harness you run against endpoints to exercise
      #              detections; it lives on the endpoints, not in this stack.
      # GOTCHA: never bind-mount inside /var/ossec/etc — the image's init skips
      # installing the FULL etc payload (shared/, decoders, lists…) if the fresh
      # volume is non-empty, and a nested mountpoint makes it non-empty. Route
      # custom content through /wazuh-config-mount instead; the entrypoint syncs
      # it into /var/ossec AFTER the payload install.
      #
      # GOTCHA 2 (corrected 2026-08-09 — this block previously claimed the sync
      # happens "on every boot", which is FALSE and had been false since
      # 2026-07-27). The sync only happens on a NEW container:
      #   docker compose up -d --force-recreate wazuh.manager
      # `restart` and `stop`+`start` reuse the container filesystem, where
      # /var/ossec/data_tmp was already deleted by the first successful init.
      # cont-init.d/0-wazuh-init then fails restoring the (permanently empty)
      # var/multigroups volume from that missing source and error_and_exit's
      # BEFORE the mount_files step ever runs. s6 logs `0-wazuh-init: exited 1`
      # and starts the daemons anyway: container Up, 10 daemons, agents Active,
      # config silently stale. Acceptance is the boot log showing
      # `Identified Wazuh configuration files to mount...` + `exited 0`, then
      # merged.mg md5 == the agent-reported Shared file hash. See runbook 06 § 3.
      - ./wazuh/custom-rules:/wazuh-config-mount/etc/rules/custom:ro
      # Shared agent-group configs. Same reasoning as custom-rules above: routed
      # through /wazuh-config-mount so the entrypoint syncs it into /var/ossec on
      # every boot. In git because /var/ossec/etc/shared/ is inside the wazuh_etc
      # volume and does NOT survive `down -v`.
      - ./wazuh/shared:/wazuh-config-mount/etc/shared:ro
      # Agent enrollment password (authd). Gitignored — only authd.pass.example is
      # tracked. Lives in the wazuh_etc volume otherwise, so it would not survive
      # `down -v`. If this file is missing while <use_password>yes</use_password> is
      # set, authd GENERATES a random password instead of failing — agents then get
      # "Invalid password" and the manager log is the only place that says why.
      - ./wazuh/authd.pass:/wazuh-config-mount/etc/authd.pass:ro
    networks: [soc]

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.dashboard
    restart: unless-stopped
    mem_reservation: 512m
    mem_limit: 1g
    oom_score_adj: -500
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASS:-SecretPassword}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASS:-kibanaserver}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASS:-MyS3cr37P450r.*-}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    networks: [soc]

  # ──────────────────── Suricata IDS (always-on, host NIC) ────────────────────
  # Sits on the physical NIC and writes eve.json to a HOST path. The native
  # Wazuh agent (agent 002, running on the host — not in this container) tails
  # that file via the phase-a-linux group config. That host path IS the
  # integration seam; there is no container-to-container link here on purpose.
  suricata:
    image: jasonish/suricata:${SURICATA_VERSION:-8.0.6}
    hostname: suricata
    restart: unless-stopped
    # HOST networking, not the `soc` bridge. An IDS on a bridge network sees
    # only that bridge — it would come up green and observe nothing real.
    # Consequence: a `networks:` key is INVALID on this service, and Suricata
    # shares the host's netns (it publishes no ports of its own).
    network_mode: host
    cap_add:
      - NET_ADMIN   # AF_PACKET capture + promiscuous mode on the NIC
      - NET_RAW     # raw socket
      - SYS_NICE    # thread priority. Without it the image's entrypoint silently
                    # drops its --user/--group args and runs Suricata as ROOT
                    # instead of failing — check the startup log, not the config.
    environment:
      # Starts crond in the entrypoint. Without it the mounted cron file below
      # is inert and the logs never rotate. See suricata/logrotate.cron.
      - ENABLE_CRON=yes
    mem_reservation: 512m
    mem_limit: 1500m        # ET Open is ~50k signatures; this is the working set
    oom_score_adj: -400     # protected, but ABOVE Wazuh's -700: under memory
                            # pressure the sensor dies before the SIEM that
                            # stores what the sensor already produced.
    # `-i <iface>` overrides the af-packet interface from the image's stock
    # suricata.yaml (which ships `eth0`).
    #
    # The --set drops `stats` records from eve.json ONLY. Wazuh's JSON decoder
    # has a hard field-count ceiling, and a Suricata stats record carries several
    # hundred counters — every one logged `wazuh-analysisd: ERROR: Too many
    # fields for JSON decoder` and was discarded, ~10k error lines/day burying
    # any real decoder error. Global `stats.enabled` stays yes, so stats.log is
    # untouched and `capture.kernel_drops` (is the sensor silently dropping
    # packets?) is still readable on the box.
    #
    # GOTCHA: `types.32` is a LIST INDEX into the stock suricata.yaml, not a
    # name — it is coupled to the pinned image tag. Re-derive it after any
    # SURICATA_VERSION bump and confirm with
    #   suricata --set <...> --dump-config | grep types.32
    # A wrong index silently sets an option on a DIFFERENT output type and the
    # errors just keep coming. Verified against 8.0.6 on 2026-08-09.
    command:
      - "-i"
      - "${SURICATA_IFACE:-eno1}"
      - "--set"
      - "outputs.1.eve-log.types.32.stats.enabled=no"
    volumes:
      # Host-visible so the native Wazuh agent can read it. Docker creates this
      # directory root-owned on first start; the agent runs as root and can read it.
      - /var/log/suricata:/var/log/suricata
      # ET Open signatures, fetched by `suricata-update` (see runbook 06). MUST
      # persist: the image ships NO rules, and Suricata with zero signatures
      # starts cleanly, logs flow/dns/tls all day, and never alerts. Green and
      # blind — precisely the failure mode ISC-26's acceptance test exists to catch.
      - suricata_rules:/var/lib/suricata
      # Drives the image's own (otherwise never-executed) logrotate policy.
      - ./suricata/logrotate.cron:/etc/cron.d/suricata-logrotate:ro
    healthcheck:
      # `suricatasc -c uptime` talks to the engine's own unix socket, so it is a
      # liveness check on the ENGINE, not on the container process.
      test: ["CMD-SHELL", "suricatasc -c uptime >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ───────────────── Recon pipeline (cron-launched, ephemeral) ─────────────────
  recon-runner:
    build:
      context: ./recon
    image: soc-recon/recon-runner:latest
    # profiles -> NOT started by `docker compose up`. Only runs when invoked:
    #   docker compose run --rm recon-runner
    profiles: ["recon"]
    restart: "no"           # run-to-completion job; never auto-restart
    mem_limit: 2g           # HARD cap — the real "Wazuh wins" guarantee
    cpus: "1.5"             # don't let nuclei pin every core
    oom_score_adj: 800      # if memory gets tight, recon dies first
    environment:
      - SCOPE_FILE=/scope/domains.txt
      - OUT_DIR=/data/recon
      - TRIAGE_DIR=/data/triage
      - NUCLEI_SEVERITY=low,medium,high,critical
    volumes:
      - ./scope:/scope:ro                  # IN-SCOPE targets only (read-only)
      - ./data:/data                       # run outputs + triage queue (host-visible)
      - recon_config:/home/recon/.config   # nuclei templates + tool config (persist)
    # No ports. No always-on footprint. Exists only while the job runs.
    networks: [recon_net]                  # isolated from the SOC network

volumes:
  indexer_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  dashboard_config:
  dashboard_custom:
  suricata_rules:
  recon_config:

networks:
  soc:
    driver: bridge
  recon_net:
    driver: bridge
