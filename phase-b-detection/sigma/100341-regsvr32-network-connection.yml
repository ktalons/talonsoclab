title: Network Connection Initiated By Regsvr32.EXE
id: a24a2b89-f604-4921-a5c5-ac4343f8eca3
related:
    - id: c7e91a02-d771-4a6d-a700-42587e0b1095
      type: derived
status: test
description: Detects a network connection initiated by regsvr32.exe, which registers DLLs and has no ordinary reason to open one.
references:
    - https://github.com/SigmaHQ/sigma/blob/53423dac8742ef6a44fb73f23f049e84594a66ce/rules/windows/network_connection/net_connection_win_regsvr32_network_activity.yml
    - https://pentestlab.blog/2017/05/11/applocker-bypass-regsvr32/
    - https://oddvar.moe/2017/12/13/applocker-case-study-how-insecure-is-it-really-part-1/
author: Dmitriy Lifanov, oscd.community, Kyle Versluis (Wazuh port)
date: 2026-11-12
tags:
    - attack.execution
    - attack.stealth
    - attack.t1559.001
    - attack.t1218.010
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Initiated: 'true'
        Image|endswith: '\regsvr32.exe'
    condition: selection
falsepositives:
    - Unknown
level: medium
custom:
    wazuh:
        id: 100341
        if_sid: '61605, 92101, 92108'
        level: 10
        mitre:
            - T1559.001
            - T1218.010
