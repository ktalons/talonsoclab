# ******************************************************************************
# *Title: 100340 certutil network connection*
# *Author: Kyle Versluis*
# *Description: Wazuh port of the SigmaHQ certutil.exe network connection rule.*
# ******************************************************************************
# Ported in full. The XML rule is 100340 in
# deploy/soc-recon/wazuh/custom-rules/local_eid3_pack.xml.
title: Uncommon Network Connection Initiated By Certutil.EXE
id: 25c545e7-2ffd-4e0a-b2ba-f5fa29bda5ca
related:
    - id: 0dba975d-a193-4ed1-a067-424df57570d1
      type: derived
status: test
description: |
    Detects a network connection initiated by the certutil.exe utility on port 80, 135, 443 or 445.
    Attackers use certutil to download a payload or to reach a remote share.
references:
    - https://github.com/SigmaHQ/sigma/blob/53423dac8742ef6a44fb73f23f049e84594a66ce/rules/windows/network_connection/net_connection_win_certutil_initiated_connection.yml
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
author: frack113, Florian Roth (Nextron Systems), Kyle Versluis (Wazuh port)
date: 2026-11-12
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        Initiated: 'true'
        DestinationPort:
            - 80
            - 135
            - 443
            - 445
    condition: selection
falsepositives:
    - Unknown
level: high
custom:
    wazuh:
        id: 100340
        if_sid: '61605, 92101, 92108'
        level: 12
        mitre:
            - T1105
