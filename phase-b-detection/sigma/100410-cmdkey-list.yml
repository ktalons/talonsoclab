# ******************************************************************************
# *Title: 100410 cmdkey list*
# *Author: Kyle Versluis*
# *Description: Wazuh port of the SigmaHQ cmdkey cached credentials rule.*
# ******************************************************************************
# Ported in part. The XML rule is 100410 in
# deploy/soc-recon/wazuh/custom-rules/local_eid1_pack.xml.
#
# Upstream's selection_img is Image OR OriginalFileName:
#   - Image|endswith: '\cmdkey.exe'
#   - OriginalFileName: 'cmdkey.exe'
# One Wazuh rule holds no OR across fields, so the port keeps the Image branch
# only. What that costs: a cmdkey.exe copied under another name runs unseen. No
# stock rule covers a renamed cmdkey.exe. See phase-b-detection/CONSTRUCTS.md.
#
# |windash is ported in full: the flag may start with a hyphen, a slash, an en
# dash, an em dash or a horizontal bar (U+2013, U+2014, U+2015).
title: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
id: 8b050878-5b3f-4a27-b108-8588c4c5b13a
related:
    - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
      type: derived
status: test
description: Detects usage of cmdkey to look for cached credentials on the system
references:
    - https://github.com/SigmaHQ/sigma/blob/53423dac8742ef6a44fb73f23f049e84594a66ce/rules/windows/process_creation/proc_creation_win_cmdkey_recon.yml
    - https://www.peew.pw/blog/2017/11/26/exploring-cmdkey-an-edge-case-for-privilege-escalation
    - https://technet.microsoft.com/en-us/library/cc754243(v=ws.11).aspx
    - https://github.com/redcanaryco/atomic-red-team/blob/b27a3cb25025161d49ac861cb216db68c46a3537/atomics/T1003.005/T1003.005.md#atomic-test-1---cached-credential-dump-via-cmdkey
author: jmallette, Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), Kyle Versluis (Wazuh port)
date: 2026-11-20
tags:
    - attack.credential-access
    - attack.t1003.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmdkey.exe'
    selection_cli:
        CommandLine|contains|windash: ' -l'
    condition: all of selection*
falsepositives:
    - Legitimate administrative tasks
level: high
custom:
    wazuh:
        id: 100410
        if_sid: '61603, 92025, 92028, 92042, 92069'
        level: 12
        mitre:
            - T1003.005
