<!-- agentconf-check self-test: the planted fault. The phase-a-windows group config as
     committed on 2026-11-14, its registry_ignore text ending in a backslash. Wazuh's XML
     reader takes that backslash as an escape for the closing tag, so the element never
     closes and verify-agent-conf must reject the file. -->
<agent_config>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <syscheck>
    <registry_ignore arch="both" type="sregex">\System\CurrentControlSet\Services\VSS\Diag\</registry_ignore>
  </syscheck>

</agent_config>
