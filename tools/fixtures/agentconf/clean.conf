<!-- agentconf-check self-test: the clean control. The phase-a-windows group config as
     corrected on 2026-11-15. verify-agent-conf must pass it. -->
<agent_config>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <syscheck>
    <registry_ignore arch="both" type="sregex">\System\CurrentControlSet\Services\VSS\Diag\|\System\CurrentControlSet\Services\VSS\Diag$</registry_ignore>
  </syscheck>

</agent_config>
